[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-lab"
version = "0.1.0"
description = "Experimentation harness for coding agents backed by llama.cpp (llama-server)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "textual>=0.60.0",
    "pytest>=9.0.2",
]

[project.scripts]
harness-lab = "main:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
py-modules = [
    "agent",
    "agent_logging",
    "app_types",
    "log_viewer",
    "main",
    "model_clients",
    "session",
    "tools",
    "tui",
    "utils",
    "workspace",
]
